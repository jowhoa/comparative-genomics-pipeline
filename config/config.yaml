# ==========================================
# PHYTOPHTHORA INFESTANS ASSEMBLY PIPELINE
# Master Configuration File
# ==========================================

sample_sheet: "config/samples.tsv"
reference_genome: "data/reference/phytophthora_reference.fasta"

# --- Organism Baseline Parameters ---
organism:
  name: "Phytophthora_infestans"
  expected_genome_size_bp: 240000000  # ~240 Mb reference size
  expected_min_coverage: 25.0
  expected_max_coverage: 120.0
  telomere_motif: "TTTAGGG" # Verified plant/oomycete motif

# --- Pre-Assembly Read QC ---
read_qc:
  min_read_length: 1000
  min_read_quality: 15
  adapter_filter:
    enabled: true
    min_length_after_trim: 1000

# --- Pre-Assembly K-mer & Ploidy Profiling ---
kmer_profiling:
  kmer_length: 21
  max_kmer_coverage: 10000
  ploidy: 2  # Baseline assumption for GenomeScope initialization

# --- Phase 1: Assembly (hifiasm) Parameter Matrix ---
# The key (e.g., 'l3_default') becomes the output folder name.
# The value is the exact string of hifiasm flags passed to the shell.
active_assemblies:
  # STAGE A (Baselines):
  l3_default: "-l3"
  l0_raw: "-l0"

  # STAGE B (Refinements - Uncomment later after evaluating Stage A):
  # l1_contained: "-l1"
  # l2_standard: "-l2"
  # l3_dual_scaf: "-l3 --dual-scaf"
  # l2_telomere_dual: "-l2 --dual-scaf --tel-m TTTAGGG"

assembly_threads: 24

# --- Phase 2: Evaluation & Annotation (BUSCO/BRAKER3) ---
busco_lineage: "eukaryota_odb10"
species_name: "my_novel_organism"
min_contig_length: 1000  # Ignore tiny, fragmented contigs

# --- Phase 3: Phylogenetics (OrthoFinder & IQ-TREE) ---
iqtree_model: "MFP"
bootstrap_replicates: 1000
